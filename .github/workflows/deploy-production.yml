name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

env:
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 1
      - name: Package tracked source only
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/lotusgather-$DEPLOY_SHA.tar.gz" HEAD
      - name: Prepare SSH identity
        run: |
          install -m 700 -d "$RUNNER_TEMP/lotusgather-ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/lotusgather-ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/lotusgather-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/lotusgather-ssh/id_ed25519" "$RUNNER_TEMP/lotusgather-ssh/known_hosts"
      - name: Upload release
        run: |
          scp -P "$VPS_PORT" -i "$RUNNER_TEMP/lotusgather-ssh/id_ed25519" -o UserKnownHostsFile="$RUNNER_TEMP/lotusgather-ssh/known_hosts" -o StrictHostKeyChecking=yes "$RUNNER_TEMP/lotusgather-$DEPLOY_SHA.tar.gz" "$VPS_USER@$VPS_HOST:/tmp/lotusgather-$DEPLOY_SHA.tar.gz"
      - name: Roll out web, API, then realtime nodes
        run: |
          ssh -p "$VPS_PORT" -i "$RUNNER_TEMP/lotusgather-ssh/id_ed25519" -o UserKnownHostsFile="$RUNNER_TEMP/lotusgather-ssh/known_hosts" -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "sudo /usr/local/sbin/lotusgather-deploy '$DEPLOY_SHA' '/tmp/lotusgather-$DEPLOY_SHA.tar.gz'"
      - name: Verify public health
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors https://lotusgather.online/
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors https://lotusgather.online/api/v1/meta
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors https://rt1.lotusgather.online/health
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors https://rt2.lotusgather.online/health
