<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2a0606">
  <title>Phòng game · Bầu Cua Tôm Cá · Chánh Điện Online</title>
  <style>
    /* Phòng game: Bầu Cua Tôm Cá. Một file, HTML/CSS/JS thuần. Cược bằng xu của ví Vườn Công Đức (xu bán trái cây,
       1 xu cược = 1 xu ví); server lắc xúc xắc và giữ số dư (API /api/v1/games/bau-cua/roll). Xu ảo, không đổi ra
       tiền thật. */
    :root {
      color-scheme: dark;
      --bg: #1c0505;
      --panel: rgba(58, 12, 10, .82);
      --line: rgba(255, 214, 140, .22);
      --gold: #ffcf5a;
      --gold-deep: #c8901f;
      --fg: #fff4e2;
      --muted: #d9b99a;
      --win: #6ee7a0;
      --lose: #ff8a7a;
      font-family: Inter, "Be Vietnam Pro", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
    html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body { color: var(--fg); background: radial-gradient(circle at 50% 0%, #6b1010 0%, #2a0606 55%, var(--bg) 100%); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
    [hidden] { display: none !important; }

    .app { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 10px; max-width: 560px; margin: 0 auto; padding: max(10px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)); }

    /* Hàng trên: tên phòng, đi nhanh, số dư. */
    .bar { display: flex; align-items: center; gap: 6px; }
    .chip { height: 36px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; font-size: 14px; white-space: nowrap; }
    .room { font-family: Georgia, serif; }
    .travel { position: relative; }
    .travel > button { color: var(--gold); }
    .travel-panel { position: absolute; z-index: 10; left: 0; top: calc(100% + 6px); width: 190px; display: grid; gap: 5px; padding: 6px; background: #2b0909; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 14px 34px rgba(0, 0, 0, .6); }
    .travel-panel button { min-height: 40px; padding: 0 10px; text-align: left; background: rgba(255, 255, 255, .05); border: 1px solid var(--line); border-radius: 9px; font-size: 13px; }
    .travel-panel button[aria-current="true"] { color: #2a1404; background: var(--gold); font-weight: 700; }
    .balance { margin-left: auto; color: var(--gold); font-weight: 800; font-variant-numeric: tabular-nums; }
    .balance small { color: var(--muted); font-weight: 500; font-size: 10px; }

    h1 { margin: 2px 0 0; text-align: center; font-family: Georgia, serif; font-size: clamp(22px, 6vw, 30px); font-weight: 600; letter-spacing: .02em; color: var(--gold); text-shadow: 0 2px 12px rgba(255, 180, 60, .35); }

    /* Bàn cược 2 × 3. */
    .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .tile { position: relative; display: grid; justify-items: center; gap: 2px; padding: 10px 6px 8px; background: linear-gradient(180deg, #fff6e4, #f3dcb4); color: #3b1408; border: 3px solid #b8862e; border-radius: 16px; box-shadow: 0 6px 0 #7a4a12, 0 10px 20px rgba(0, 0, 0, .35); transition: transform .08s ease; }
    .tile:active { transform: translateY(3px); box-shadow: 0 3px 0 #7a4a12, 0 6px 14px rgba(0, 0, 0, .35); }
    .tile .icon { font-size: clamp(34px, 11vw, 48px); line-height: 1.1; }
    .tile .name { font-weight: 800; font-size: 14px; }
    .tile .bet { min-width: 64px; padding: 2px 8px; color: #fff4e2; background: #7a1515; border-radius: 999px; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: center; }
    .tile .bet.zero { background: rgba(122, 21, 21, .25); color: #7a4a30; }
    .tile .plus { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; display: grid; place-items: center; color: #2a1404; background: var(--gold); border: 0; border-radius: 50%; font-weight: 900; font-size: 16px; box-shadow: 0 2px 0 var(--gold-deep); }
    .tile.hit { border-color: #2fbf71; background: linear-gradient(180deg, #eafff2, #c6f3d8); }
    .tile.hit::after { content: attr(data-hits); position: absolute; top: -8px; left: -8px; min-width: 26px; height: 26px; padding: 0 6px; display: grid; place-items: center; color: #fff; background: #1f9d55; border-radius: 999px; font-size: 13px; font-weight: 800; box-shadow: 0 3px 8px rgba(0, 0, 0, .35); }

    /* Mệnh giá chip. */
    .chips { display: flex; justify-content: center; gap: 8px; }
    .chips button { width: 54px; height: 54px; border-radius: 50%; border: 4px dashed rgba(255, 255, 255, .55); font-weight: 800; font-size: 14px; color: #fff; box-shadow: 0 4px 10px rgba(0, 0, 0, .4); }
    .chips button[data-chip="1"] { background: #2f80ed; }
    .chips button[data-chip="5"] { background: #27ae60; }
    .chips button[data-chip="10"] { background: #d63031; }
    .chips button[data-chip="50"] { background: #8e44ad; }
    .chips button[aria-pressed="true"] { outline: 3px solid var(--gold); outline-offset: 3px; transform: translateY(-2px); }

    /* Đĩa xúc xắc. */
    .plate { display: grid; justify-items: center; gap: 8px; padding: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; }
    .dice { display: flex; gap: 12px; padding: 14px 18px; background: radial-gradient(circle, #fffaf0, #e9d3a8); border: 4px solid #b8862e; border-radius: 999px; box-shadow: inset 0 4px 14px rgba(0, 0, 0, .25), 0 8px 18px rgba(0, 0, 0, .35); }
    .die { width: clamp(54px, 16vw, 68px); aspect-ratio: 1; display: grid; place-items: center; font-size: clamp(32px, 10vw, 42px); background: #fff; border-radius: 14px; box-shadow: 0 4px 0 #c9b28a, 0 6px 12px rgba(0, 0, 0, .25); }
    .rolling .die { animation: shake .12s linear infinite; }
    .rolling .die:nth-child(2) { animation-delay: -.04s; }
    .rolling .die:nth-child(3) { animation-delay: -.08s; }
    @keyframes shake { 0% { transform: translate(0, 0) rotate(0); } 25% { transform: translate(-3px, 2px) rotate(-8deg); } 50% { transform: translate(2px, -3px) rotate(6deg); } 75% { transform: translate(3px, 2px) rotate(-4deg); } 100% { transform: translate(0, 0) rotate(0); } }
    .message { min-height: 22px; margin: 0; text-align: center; font-weight: 700; font-size: 15px; }
    .message.win { color: var(--win); }
    .message.lose { color: var(--lose); }
    .history { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; min-height: 18px; color: var(--muted); font-size: 12px; }

    .actions { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-top: auto; }
    .actions button { height: 54px; border: 0; border-radius: 14px; font-size: 17px; font-weight: 800; }
    .clear { color: var(--fg); background: rgba(255, 255, 255, .08); border: 1px solid var(--line) !important; }
    .roll { color: #2a1404; background: linear-gradient(180deg, #ffe08a, #f2b632); box-shadow: 0 5px 0 var(--gold-deep); }
    .roll:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--gold-deep); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .sign-in { justify-self: center; padding: 8px 16px; color: #2a1404; background: var(--gold); border: 0; border-radius: 999px; font-weight: 800; }
    .note { margin: 0; color: var(--muted); font-size: 10.5px; text-align: center; }
    .note a { color: var(--gold); }

    /* Màn thấp (điện thoại nhỏ / xoay ngang): thu gọn khoảng cách. */
    @media (max-height: 700px) {
      .app { gap: 6px; }
      .tile { padding: 6px 4px; }
      .tile .icon { font-size: 30px; }
      .chips button { width: 44px; height: 44px; font-size: 12px; }
      .dice { padding: 8px 12px; }
      .die { width: 48px; font-size: 28px; }
      .actions button { height: 46px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="bar">
      <span class="chip room">🎲 Phòng game</span>
      <div class="travel">
        <button type="button" class="chip" id="travelToggle" aria-haspopup="menu" aria-expanded="false">📍 Đi nhanh ▾</button>
        <div class="travel-panel" id="travelPanel" role="menu" hidden>
          <button type="button" role="menuitem" data-destination="hall">🛕 Chánh điện</button>
          <button type="button" role="menuitem" data-destination="courtyard">🌳 Ngoài sân</button>
          <button type="button" role="menuitem" data-destination="garden">🌱 Khu vườn</button>
          <button type="button" role="menuitem" data-destination="cinema">🎬 Rạp phim</button>
          <button type="button" role="menuitem" data-destination="games" aria-current="true">🎲 Phòng game</button>
        </div>
      </div>
      <span class="chip balance" aria-live="polite">🪙 <span id="balance">…</span><small>xu</small></span>
    </div>

    <h1>Bầu Cua Tôm Cá</h1>

    <section class="board" id="board" aria-label="Bàn cược: chạm linh vật để đặt cược"></section>

    <div class="chips" id="chips" role="group" aria-label="Mệnh giá mỗi lần đặt">
      <button type="button" data-chip="1" aria-pressed="true">1</button>
      <button type="button" data-chip="5" aria-pressed="false">5</button>
      <button type="button" data-chip="10" aria-pressed="false">10</button>
      <button type="button" data-chip="50" aria-pressed="false">50</button>
    </div>

    <section class="plate" aria-label="Đĩa xúc xắc">
      <div class="dice" id="dice">
        <span class="die">🦌</span><span class="die">🍈</span><span class="die">🐓</span>
      </div>
      <p class="message" id="message" role="status" aria-live="polite">Chọn mệnh giá rồi chạm linh vật để đặt cược</p>
      <div class="history" id="history" aria-label="Các ván trước"></div>
      <button type="button" class="sign-in" id="signIn" hidden>🛕 Về chùa đăng nhập</button>
    </section>

    <div class="actions">
      <button type="button" class="clear" id="clear">Xóa cược</button>
      <button type="button" class="roll" id="roll">🎲 Lắc</button>
    </div>
    <p class="note">Cược bằng xu Vườn Công Đức (xu bán trái cây). Xu ảo, không quy đổi ra tiền thật. · <a href="/ung-ho.html">💝 Góp duy trì server</a> · <a href="/ho-tro.html?from=/game.html">🛟 Góp ý / Báo lỗi</a></p>
  </main>

  <script type="module">
    // ---- Dữ liệu ----
    const ANIMALS = [
      { id: 'nai', name: 'Nai', icon: '🦌' },
      { id: 'bau', name: 'Bầu', icon: '🍈' },
      { id: 'ga', name: 'Gà', icon: '🐓' },
      { id: 'ca', name: 'Cá', icon: '🐟' },
      { id: 'cua', name: 'Cua', icon: '🦀' },
      { id: 'tom', name: 'Tôm', icon: '🦐' },
    ];
    const ROLL_MS = 1000;

    const randomAnimal = () => ANIMALS[Math.floor(Math.random() * ANIMALS.length)].id;
    const iconOf = (id) => ANIMALS.find((animal) => animal.id === id).icon;
    const money = (value) => `${value < 0 ? '-' : ''}${Math.abs(value).toLocaleString('vi-VN')} xu`;

    // ---- Trạng thái ----
    // coins: số dư ví trên server (null = chưa biết / chưa đăng nhập). Cược đặt trên bàn chỉ là dự định ở máy mình,
    // tới lúc bấm Lắc mới gửi server; số dư hiện ra = ví − tổng cược đang đặt.
    let coins = null;
    let signedIn = false;
    let bets = Object.fromEntries(ANIMALS.map((animal) => [animal.id, 0]));
    let chip = 1;
    let rolling = false;
    // Khóa idempotency của ván đang gửi: mạng lỗi bấm Lắc lại thì gửi lại đúng ván đó (server không trừ hai lần).
    let pendingKey = null;
    const history = [];
    const staked = () => Object.values(bets).reduce((sum, value) => sum + value, 0);
    const available = () => (coins ?? 0) - staked();

    const $ = (id) => document.getElementById(id);
    const elements = { board: $('board'), balance: $('balance'), dice: $('dice'), message: $('message'), history: $('history'), roll: $('roll'), clear: $('clear'), signIn: $('signIn'), chips: $('chips') };

    // ---- Giao diện ----
    const tiles = new Map();
    for (const animal of ANIMALS) {
      const tile = document.createElement('button');
      tile.type = 'button';
      tile.className = 'tile';
      tile.dataset.id = animal.id;
      tile.setAttribute('aria-label', `Đặt cược ${animal.name}`);
      const icon = document.createElement('span');
      icon.className = 'icon';
      icon.textContent = animal.icon;
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = animal.name;
      const bet = document.createElement('span');
      bet.className = 'bet';
      const plus = document.createElement('span');
      plus.className = 'plus';
      plus.textContent = '+';
      plus.setAttribute('aria-hidden', 'true');
      tile.append(plus, icon, name, bet);
      elements.board.append(tile);
      tiles.set(animal.id, { tile, bet });
    }

    // Số dư ví (xu bán trái cây) từ server; chưa đăng nhập thì không có ví.
    async function loadWallet() {
      try {
        const response = await fetch('/api/v1/garden/me', { cache: 'no-store' });
        signedIn = response.ok;
        coins = response.ok ? (await response.json()).me.coins : null;
      } catch {
        signedIn = false;
      }
      if (!signedIn) say('Đăng nhập ở cổng chùa để chơi bằng xu Vườn Công Đức', 'lose');
      else if (!coins) say('Ví đang hết xu: ra Khu vườn bán trái cây để có xu nhé');
      render();
    }

    function say(text, tone = '') {
      elements.message.textContent = text;
      elements.message.className = `message ${tone}`;
    }

    function render() {
      elements.balance.textContent = coins === null ? '—' : available().toLocaleString('vi-VN');
      for (const [id, { bet }] of tiles) {
        bet.textContent = money(bets[id]);
        bet.classList.toggle('zero', !bets[id]);
      }
      elements.roll.disabled = rolling || !staked();
      elements.clear.disabled = rolling || !staked();
      elements.signIn.hidden = signedIn || coins !== null;
      for (const button of elements.chips.querySelectorAll('button')) {
        button.setAttribute('aria-pressed', String(Number(button.dataset.chip) === chip));
        button.disabled = rolling;
      }
    }

    function clearHits() {
      for (const { tile } of tiles.values()) {
        tile.classList.remove('hit');
        delete tile.dataset.hits;
      }
    }

    // ---- Thao tác ----
    elements.chips.addEventListener('click', (event) => {
      const button = event.target.closest('[data-chip]');
      if (!button) return;
      chip = Number(button.dataset.chip);
      render();
    });

    // Đặt cược (trên bàn, chưa trừ ví): không vượt số xu đang có; hết xu thì đặt nốt phần còn lại.
    elements.board.addEventListener('click', (event) => {
      const tile = event.target.closest('.tile');
      if (!tile || rolling) return;
      if (!signedIn) {
        say('Đăng nhập ở cổng chùa để chơi bằng xu Vườn Công Đức', 'lose');
        return;
      }
      if (available() <= 0) {
        say('Hết xu rồi! Ra Khu vườn bán trái cây để có thêm xu', 'lose');
        return;
      }
      const amount = Math.min(chip, available());
      bets[tile.dataset.id] += amount;
      pendingKey = null;
      clearHits();
      say(`Đặt ${money(amount)} vào ${ANIMALS.find((animal) => animal.id === tile.dataset.id).name}`);
      render();
    });

    elements.clear.addEventListener('click', () => {
      if (rolling) return;
      for (const id of Object.keys(bets)) bets[id] = 0;
      pendingKey = null;
      clearHits();
      say('Đã xóa cược');
      render();
    });

    elements.signIn.addEventListener('click', () => travelTo('hall'));

    // Lắc: gửi cược lên server (server lắc, trừ/cộng xu). Trong lúc chờ, xúc xắc nhảy mặt ít nhất 1 giây rồi chốt
    // đúng kết quả server trả về; cược về 0 sau mỗi ván.
    elements.roll.addEventListener('click', async () => {
      if (rolling || !staked()) return;
      rolling = true;
      clearHits();
      say('Đang lắc…');
      render();
      const faces = [...elements.dice.children];
      elements.dice.classList.add('rolling');
      const spin = setInterval(() => {
        for (const face of faces) face.textContent = iconOf(randomAnimal());
      }, 70);
      pendingKey ||= crypto.randomUUID();
      const sent = Object.fromEntries(Object.entries(bets).filter(([, amount]) => amount));
      let result = null;
      const [response] = await Promise.all([
        fetch('/api/v1/games/bau-cua/roll', {
          method: 'POST',
          headers: { 'content-type': 'application/json', 'idempotency-key': pendingKey },
          body: JSON.stringify({ bets: sent }),
        }).catch(() => null),
        new Promise((resolve) => setTimeout(resolve, ROLL_MS)),
      ]);
      try { result = response ? await response.json() : null; } catch {}
      clearInterval(spin);
      elements.dice.classList.remove('rolling');
      rolling = false;
      if (!result) {
        // Không rõ server đã nhận chưa: giữ cược và khóa, bấm Lắc lại sẽ gửi đúng ván này.
        say('Mất kết nối, bấm Lắc lại (không bị trừ xu hai lần)', 'lose');
        render();
        return;
      }
      pendingKey = null;
      if (!result.ok) {
        if (result.code === 'NOT_SIGNED_IN') {
          signedIn = false;
          coins = null;
          say('Phiên đăng nhập đã hết, về chùa đăng nhập lại nhé', 'lose');
        } else if (result.code === 'INSUFFICIENT_COINS') {
          coins = result.coins ?? coins;
          say('Không đủ xu cho ván này', 'lose');
        } else if (result.code === 'RATE_LIMITED') say('Lắc chậm lại một chút nhé', 'lose');
        else say('Ván này không hợp lệ, thử lại nhé', 'lose');
        bets = Object.fromEntries(ANIMALS.map((animal) => [animal.id, 0]));
        render();
        return;
      }
      faces.forEach((face, index) => { face.textContent = iconOf(result.dice[index]); });
      coins = result.coins;
      for (const [id, count] of Object.entries(result.hits)) {
        const { tile } = tiles.get(id);
        tile.classList.add('hit');
        tile.dataset.hits = `×${count}`;
      }
      if (result.net > 0) say(`Thắng ${money(result.net)}! 🎉`, 'win');
      else if (result.net < 0) say(`Thua ${money(-result.net)}`, 'lose');
      else say('Hòa vốn');
      history.unshift(result.dice.map(iconOf).join(''));
      history.length = Math.min(history.length, 8);
      elements.history.replaceChildren(...history.map((item) => {
        const span = document.createElement('span');
        span.textContent = item;
        return span;
      }));
      bets = Object.fromEntries(ANIMALS.map((animal) => [animal.id, 0]));
      render();
    });

    // ---- Đi nhanh sang map khác (chùa: quay về đúng phòng vừa ở, như rạp phim) ----
    const travelToggle = $('travelToggle');
    const travelPanel = $('travelPanel');
    const openTravel = (next) => {
      travelPanel.hidden = !next;
      travelToggle.setAttribute('aria-expanded', String(next));
    };
    travelToggle.addEventListener('click', () => openTravel(travelPanel.hidden));
    document.addEventListener('pointerdown', (event) => {
      if (!event.target.closest('.travel')) openTravel(false);
    });
    travelPanel.addEventListener('click', (event) => {
      const destination = event.target.closest('[data-destination]')?.dataset.destination;
      openTravel(false);
      if (destination && destination !== 'games') travelTo(destination);
    });
    function travelTo(destination) {
      if (destination === 'cinema') {
        location.href = '/room.html?room=cinema-1';
        return;
      }
      let back = '/chanh-dien.html';
      try { back = sessionStorage.getItem('thien-return') || back; } catch {}
      const url = new URL(back, location.origin);
      if (url.origin !== location.origin) return;
      url.searchParams.set('go', destination);
      location.href = `${url.pathname}${url.search}`;
    }

    render();
    loadWallet();
    // Quay lại tab (vd: vừa bán trái cây ở chùa): đọc lại số xu.
    document.addEventListener('visibilitychange', () => { if (!document.hidden && !rolling) loadWallet(); });
  </script>
</body>
</html>
