include /etc/nginx/snippets/cloudflare-realip.conf;

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

limit_req_zone $binary_remote_addr zone=lotus_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=lotus_ws_handshake:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=lotus_ws_connections:10m;

upstream lotus_web {
  server 127.0.0.1:3000;
  keepalive 32;
}

upstream lotus_api {
  server 127.0.0.1:4000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name www.lotusgather.online;
  return 301 https://lotusgather.online$request_uri;
}

server {
  listen 80;
  listen [::]:80;
  server_name lotusgather.online;

  location ^~ /api/ {
    limit_req zone=lotus_api burst=60 nodelay;
    proxy_pass http://lotus_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
  }

  # Khi chạy không có Redis/directory, API trả /ws và cổng này đưa client vào node đầu tiên.
  location = /ws {
    limit_req zone=lotus_ws_handshake burst=20 nodelay;
    limit_conn lotus_ws_connections 8;
    proxy_pass http://127.0.0.1:4001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  # Tên file hiện chưa gắn hash: cache trình duyệt ngắn, cache Cloudflare một giờ để deploy mới sớm có hiệu lực.
  location ~* \.(?:css|js|mjs|jpg|jpeg|png|svg|webp|glb|mp3)$ {
    proxy_pass http://lotus_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=300, s-maxage=3600, stale-while-revalidate=300" always;
    add_header X-Content-Type-Options nosniff always;
  }

  location / {
    proxy_pass http://lotus_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name rt1.lotusgather.online;

  location = /health {
    proxy_pass http://127.0.0.1:4001/health;
    proxy_set_header Host $host;
  }

  location = /ws {
    limit_req zone=lotus_ws_handshake burst=20 nodelay;
    limit_conn lotus_ws_connections 8;
    proxy_pass http://127.0.0.1:4001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }
}

